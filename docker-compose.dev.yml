services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${SITE_NAME:-leverage-lab}-jekyll-dev
    ports:
      - "${PORT:-4077}:4000"
      - "${LIVERELOAD_PORT:-35806}:35729"
    volumes:
      - .:/site
      - bundle-cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling --config _config.yml,_config.dev.yml

volumes:
  bundle-cache:
