title: "Leverage Lab"
tagline: "A constraint simulator for human-agent delivery systems"
description: >-
  Explore why more software-building capacity does not necessarily create more
  accepted outcomes—and what changes when the constraint moves.
author:
  name: "Bill Eisenhauer"
url: "https://billeisenhauer.github.io"
baseurl: "/leverage-lab-web"

# Analytics is only loaded in production after explicit visitor consent.
google_analytics: "G-D1LY1DX2DR"

markdown: kramdown
permalink: pretty
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      image: "/assets/images/og.png"

exclude:
  - Dockerfile.dev
  - docker-compose.dev.yml
  - dx
  - tests
  - vendor
  - README.md
  - DX_PROTOCOL.md
  - Gemfile.lock
  - .env
  - .env.example
  - .github
  - remotion
